<script>
try{
  var t=localStorage.getItem("paseo-theme")||"dark";
  var q=location.search;
  if(/[?&]theme=light(?:&|$)/.test(q)) t="light";

<style>
:root{
  --sunset:linear-gradient(135deg,#FF7A59 0%,#FF9F4A 55%,#FFC65C 100%);
  --up:#FF5D6C;--down:#2FD08A;--wa:#25D366;
  --r-xl:28px;--r-lg:22px;--r-md:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0A0C11;--bg2:#0F1219;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.075);--solid:#141822;
  --line:rgba(255,255,255,.08);--text:#F5F2ED;--muted:#9097A6;--faint:#5B6170;
  --accent:#FF9152;--accent-soft:rgba(255,145,82,.14);--glow:rgba(255,122,89,.28);--shadow:0 20px 50px -20px rgba(0,0,0,.8);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#F6F1EA;--bg2:#EFE8DE;--surface:#FFFFFF;--surface2:#FBF8F4;--solid:#FFFFFF;
  --line:rgba(30,25,20,.08);--text:#1C1A17;--muted:#7A736A;--faint:#AAA298;
  --accent:#E8692F;--accent-soft:rgba(232,105,47,.10);--glow:rgba(255,145,82,.25);--shadow:0 16px 40px -22px rgba(80,50,20,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Heebo,system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s var(--ease),color .4s}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;user-select:none}
.num{font-family:Rubik,Heebo,sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;position:relative;padding-bottom:120px}
.sky{position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;overflow:hidden;z-index:0}
.sky::before{content:"";position:absolute;top:-180px;right:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);filter:blur(10px);animation:breathe 9s ease-in-out infinite}
.sky::after{content:"";position:absolute;top:-120px;left:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),transparent 65%)}
[data-theme=light] .sky::after{background:radial-gradient(circle,rgba(59,130,246,.10),transparent 65%)}
@keyframes breathe{50%{transform:scale(1.08) translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sheetIn{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.stagger>*{animation:rise .55s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 6px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--sunset);display:grid;place-items:center;box-shadow:0 8px 24px -8px var(--glow)}
.logo svg{width:24px;height:24px}
.brand b{font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:17px;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s var(--ease)}
.iconbtn:active{transform:scale(.92)}
.hello{position:relative;z-index:1;padding:18px 20px 6px}
.hello .date{font-size:13.5px;color:var(--muted);font-weight:500}
.hello h1{font-family:Rubik,Heebo,sans-serif;font-size:31px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin-top:2px}
.hello h1 span{background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{position:relative;z-index:1;margin:16px 16px 0;border-radius:var(--r-xl);padding:20px 18px 10px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 100% 0%,var(--accent-soft),transparent 60%);pointer-events:none}
.hero-head{position:relative;display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring .t{direction:ltr;position:absolute;inset:0;display:grid;place-items:center;font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:17px}
.ring .t small{font-size:11px;color:var(--muted);font-weight:500}
.hero-head h2{font-family:Rubik,Heebo,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.3px}
.hero-head p{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.hero-head p b{color:var(--text);font-weight:600}
.due{position:relative;display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0}
.due.empty{justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
.av{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:17px;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.due .mid{flex:1;min-width:0}
.due .nm{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip svg.i{width:13px;height:13px}
.chip.hot{background:rgba(255,93,108,.13);color:var(--up)}
.chip.warm{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:rgba(47,208,138,.12);color:var(--down)}
.go{height:52px;min-width:86px;padding:0 18px;border-radius:16px;background:var(--sunset);color:#2A1305;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 24px -10px var(--glow);transition:transform .18s var(--ease)}
.go svg.i{width:18px;height:18px}
.go:active{transform:scale(.94)}
.go.done{background:rgba(47,208,138,.14);color:var(--down);box-shadow:none}
.sec{position:relative;z-index:1;padding:28px 20px 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h3{font-family:Rubik,Heebo,sans-serif;font-size:19px;font-weight:700;letter-spacing:-.2px}
.sec span{font-size:13px;color:var(--muted)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.alert{scroll-snap-align:start;flex:none;width:236px;border-radius:var(--r-lg);padding:15px;background:var(--solid);border:1px solid var(--line);position:relative;overflow:hidden;text-align:right}
.alert::after{content:"";position:absolute;left:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,93,108,.18),transparent 70%)}
.alert .sup{font-size:12px;color:var(--muted);font-weight:600}
.alert .pn{font-weight:700;font-size:14.5px;line-height:1.35;margin:4px 0 12px;height:39px;overflow:hidden}
.alert .row{display:flex;align-items:center;justify-content:space-between}
.px{font-family:Rubik,Heebo,sans-serif;font-size:13px;color:var(--muted)}
.px s{opacity:.7}.px b{color:var(--text);font-size:17px;font-weight:700}
.delta{font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:13px;padding:4px 9px;border-radius:10px;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--up);background:rgba(255,93,108,.13)}
.delta.down{color:var(--down);background:rgba(47,208,138,.12)}
.seg{display:flex;gap:8px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.seg::-webkit-scrollbar{display:none}
.seg button{height:42px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:all .25s var(--ease)}
.seg button.on{background:var(--text);color:var(--bg);border-color:transparent}
.list{padding:8px 16px 0;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.card{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:right;width:100%;transition:transform .2s var(--ease),background .2s}
.card:active{transform:scale(.98);background:var(--surface2)}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:16px}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;width:62px;flex:none}
.spark i{flex:1;border-radius:2px;background:var(--accent);opacity:.85;min-height:2px}
.spark i.z{background:var(--line);opacity:1}
.chev{color:var(--faint)}
.fold{margin:14px 16px 0;width:calc(100% - 32px);height:54px;border-radius:var(--r-md);border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent)}
.nav-in{display:flex;justify-content:space-around;padding:7px;border-radius:24px;background:var(--solid);background:color-mix(in srgb,var(--solid) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
.nav button{flex:1;height:54px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);transition:all .25s var(--ease)}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.sp-head{position:relative;z-index:1;padding:8px 20px 0}
.sp-id{display:flex;align-items:center;gap:15px;margin-top:10px}
.sp-id .av{width:64px;height:64px;border-radius:21px;font-size:23px}
.sp-id h1{font-family:Rubik,Heebo,sans-serif;font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.sp-id p{color:var(--muted);font-size:13.5px;margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.act{height:50px;border-radius:15px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;text-decoration:none}
.act.wa{color:var(--wa)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fact{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:10px 11px}
.fact small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.fact b{display:block;font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refill{margin:16px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;text-align:right;position:relative;z-index:1}
.refill .mid{flex:1}.refill small{display:block;font-weight:500;font-size:12.5px;opacity:.85;margin-top:1px}
.search{margin:12px 16px 0;position:relative;z-index:1}
.search input{width:100%;height:52px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15.5px;padding:0 46px 0 16px;outline:none;transition:border .2s}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;right:15px;top:15px;color:var(--faint)}
.grp{padding:22px 22px 8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.items{padding:0 16px;display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);position:relative;transition:all .25s var(--ease)}
.item.sel{background:linear-gradient(90deg,var(--surface) 30%,var(--accent-soft));border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.item.sel::before{content:"";position:absolute;right:-1px;top:14px;bottom:14px;width:4px;border-radius:4px 0 0 4px;background:var(--sunset)}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:650;font-size:15.5px;line-height:1.3}
.item .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.item .meta .pr{font-family:Rubik,Heebo,sans-serif;color:var(--text);font-weight:600}
.item .meta .stale{color:var(--faint)}
.item .delta{font-size:11.5px;padding:2px 7px;border-radius:8px}
.units{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.units button{height:26px;padding:0 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:700}
.units button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:16px;padding:3px;border:1px solid var(--line)}
.step button{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
.step button:active{transform:scale(.88)}
.step .plus{background:var(--sunset);color:#2A1305}
.step .q{min-width:34px;text-align:center;font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:18px}
.step .q small{display:block;font-size:10px;color:var(--muted);font-family:Heebo,system-ui,sans-serif;font-weight:600;margin-top:-2px}
.qinput{width:36px;border:0;background:transparent;text-align:center;font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:18px;color:var(--text);padding:0;outline:none;direction:ltr;-moz-appearance:textfield}
.qinput::-webkit-outer-spin-button,.qinput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step.zero .minus{opacity:.35}
.q.bump{animation:pop .3s var(--ease)}
.insights{position:relative;z-index:1;margin:14px 16px 0;padding:12px 14px;border-radius:18px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.insights h4{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:2px}
.insights p{font-size:13px;line-height:1.4;margin-top:4px}
.insights .more{margin-top:8px;font-size:13px;font-weight:800;color:var(--accent)}
.cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(140%);width:100%;max-width:480px;z-index:25;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);transition:transform .45s var(--ease)}
.cart.show{transform:translateX(-50%)}
.cart button{width:100%;height:64px;border-radius:22px;background:var(--sunset);color:#2A1305;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;box-shadow:0 18px 40px -14px var(--glow)}
.cart .cnt{width:44px;height:44px;border-radius:14px;background:rgba(42,19,5,.14);display:grid;place-items:center;font-family:Rubik,Heebo,sans-serif;font-weight:800;font-size:18px}
.cart .lbl{flex:1;text-align:right;font-weight:800;font-size:17px}
.cart .lbl small{display:block;font-weight:600;font-size:12.5px;opacity:.75}
.cart .sum{font-family:Rubik,Heebo,sans-serif;font-weight:800;font-size:18px;direction:ltr}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .3s both;display:none}
.sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;z-index:41;max-height:92dvh;overflow:auto;background:var(--bg2);border-radius:30px 30px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:none}
.sheet.show{display:block;animation:sheetIn .5s var(--ease) both}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-title{display:flex;align-items:center;gap:12px}
.sh-title h2{font-family:Rubik,Heebo,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.3px}
.sh-title p{font-size:13px;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:11px 12px}
.kpi small{font-size:11px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:Rubik,Heebo,sans-serif;font-size:19px;font-weight:700;margin-top:2px;direction:ltr;text-align:right}
.wa-prev{margin-top:14px;border-radius:22px;padding:14px;background:#0B141A}
[data-theme=light] .wa-prev{background:#EFE7DD}
.wa-prev .who{font-size:11.5px;color:#8696A0;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bubble{background:#005C4B;color:#E9EDEF;border-radius:14px 4px 14px 14px;padding:10px 12px 6px;font-size:14px;line-height:1.55;white-space:pre-wrap;max-width:92%;margin-inline-start:auto;box-shadow:0 1px 1px rgba(0,0,0,.2);user-select:text}
[data-theme=light] .bubble{background:#D9FDD3;color:#111B21}
.bubble .tm{display:block;text-align:left;font-size:10.5px;opacity:.6;margin-top:2px;direction:ltr}
.sh-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px -18px 0;padding:12px 18px calc(4px + env(safe-area-inset-bottom));position:sticky;bottom:-22px;background:linear-gradient(to top,var(--bg2) 75%,transparent)}
.sh-acts .big{grid-column:1/-1;height:62px;border-radius:20px;background:var(--wa);color:#04210F;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 34px -16px rgba(37,211,102,.6)}
.sh-acts .sm{height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.lines{margin-top:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:4px 14px}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ln:last-child{border:0}
.ln .qq{font-family:Rubik,Heebo,sans-serif;font-weight:700;min-width:58px;color:var(--accent)}
.ln .nn{flex:1}
.ln .tt{font-family:Rubik,Heebo,sans-serif;color:var(--muted);font-size:13.5px;direction:ltr}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-260%);visibility:hidden;z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;transition:transform .45s var(--ease);display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast.show{transform:translate(-50%,0);visibility:visible}
.hidden{display:none!important}
.empty{color:var(--muted);text-align:center;padding:30px 16px;font-size:14px;line-height:1.5}
.note{margin:8px 16px 0;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.55;position:relative;z-index:1}
.hist{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.hist .d{font-family:Rubik,Heebo,sans-serif;font-weight:700;font-size:14px;text-align:center;min-width:44px;line-height:1.1}
.hist .d small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.hist .mid{flex:1;min-width:0}.hist .nm{font-weight:700}.hist .meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
#boot{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--muted);text-align:center;padding:24px}
#boot p{font-size:14px;font-weight:600}
.spinner{width:28px;height:28px;border:2px solid var(--line);border-top-color:#FF9152;border-radius:50%;animation:spin .7s linear infinite}
.boot-btn{height:46px;padding:0 18px;border-radius:14px;background:var(--sunset);color:#2A1305;font-weight:800}
</style>
</head>
<body>
<div id="boot"><div class="spinner"></div><p>טוען את פסאו…</p></div>
<div class="app hidden" id="app">
  <div class="sky"></div>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#2A1305" stroke-width="2" stroke-linecap="round"><path d="M7 13a5 5 0 0 1 10 0"/><path d="M12 4v2M5.6 6.6l1.4 1.4M18.4 6.6 17 8M3 13h2M19 13h2"/><path d="M3 17c1.5 0 1.5 1 3 1s1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/></svg></div>
      <div><b>פסאו</b><small>גג על הים · הזמנות</small></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn hidden" id="back" type="button" aria-label="חזרה"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="iconbtn" id="theme" type="button" aria-label="מצב תצוגה"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav hidden" id="nav"><div class="nav-in">
  <button type="button" data-nav="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>היום</button>
  <button type="button" data-nav="all"><svg class="i" viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>ספקים</button>
  <button type="button" data-nav="prices"><svg class="i" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>מחירים</button>
  <button type="button" data-nav="history"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>היסטוריה</button>
</div></nav>
<div class="cart" id="cart"><button type="button" id="cartBtn"><span class="cnt" id="cartN">0</span><span class="lbl">לסיכום ההזמנה<small id="cartSup"></small></span><span class="sum" id="cartSum"></span><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
const SB="https://vzeowbriddhvhpishmhn.supabase.co";
const SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6ZW93YnJpZGRodmhwaXNobWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MTAyNDUsImV4cCI6MjA4ODM4NjI0NX0.PWvjFj41l0wB9awroZdDsMhCJ0yJXdrf1-k-45n0Rwk";
const DOW=["sun","mon","tue","wed","thu","fri","sat"];
const DH={sun:"א׳",mon:"ב׳",tue:"ג׳",wed:"ד׳",thu:"ה׳",fri:"ו׳",sat:"ש׳"};
const DFULL={sun:"ראשון",mon:"שני",tue:"שלישי",wed:"רביעי",thu:"חמישי",fri:"שישי",sat:"שבת"};
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const CAT={food:"אוכל",equipment:"חד פעמי",cleaning:"חד פעמי","אלכוהל":"בר","יינות":"בר",beverage:"בר"};
const NON=new Set(["tech","logistics","utilities"]);
/* Approved UI grouping only. Rows stay in the database. */
const QUIET=new Set(["90002","AKKERMAN","50014","51566","90009","50149","51574","50162","50329","50352","51575","51557","50197","90010","50188","90008"]);
const SEASONAL=new Set(["HAREL","90002"]);
const TALA_ORDER=["TALA_DRY","TALA_VEG","TALA_ASIA"];
const PAL=[["#FF7A59","#FFB547"],["#6366F1","#22D3EE"],["#10B981","#A3E635"],["#EC4899","#F59E0B"],["#8B5CF6","#EC4899"],["#0EA5E9","#6366F1"],["#F43F5E","#FB923C"],["#14B8A6","#3B82F6"]];
const I={
 sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 truck:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
 chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
 phone:'<svg class="i" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
 wa:'<svg class="i" viewBox="0 0 24 24"><path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 7.9 19.6z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .9a4 4 0 0 1-2.2-2.2l.9-1-1-2z"/></svg>',
 search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
 plus:'<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg>',
 minus:'<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12h14"/></svg>',
 redo:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16"/></svg>',
 copy:'<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
 trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>',
 eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 up:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 down:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
 check:'<svg class="i" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="m5 12 5 5 9-10"/></svg>',
 send:'<svg class="i" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>{n=Number(n);if(!Number.isFinite(n))return "";return (n>=100?Math.round(n).toLocaleString("he-IL"):n.toFixed(n%1?2:0))+"\u00a0₪";};
const pretty=u=>String(u||"יח'").replace(/'/g,"׳");
function ilNow(){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Jerusalem",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"}).formatToParts(new Date());
  const g=t=>parts.find(p=>p.type===t).value;
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  let hh=+g("hour"); if(hh===24) hh=0;
  return {y:+g("year"),m:+g("month"),d:+g("day"),hh,mm:+g("minute"),wd:map[g("weekday")]??0};
}
const iso=n=>n.y+"-"+String(n.m).padStart(2,"0")+"-"+String(n.d).padStart(2,"0");
function norm(s){return String(s||"").replace(/[\s"'׳״]/g,"");}
function asArr(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(typeof v==="string" && v[0]==="{") return v.slice(1,-1).split(",").map(x=>x.replace(/^"|"$/g,"")).filter(Boolean);
  return [];
}
function initials(n){
  const w=String(n||"").replace(/[()\.]/g," ").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "•";
  return (w[0][0]+(w[1]?w[1][0]:"")).toUpperCase();
}
function hue(id){let h=0;for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];}
function av(s){const [a,b]=hue(s.id);return `<div class="av" style="background:linear-gradient(135deg,${a},${b})">${esc(initials(s.n))}</div>`;}
let NOW=ilNow();
function daysAgo(d){
  if(!d) return null;
  const [y,m,day]=String(d).split("-").map(Number);
  const x=Math.round((Date.UTC(NOW.y,NOW.m-1,NOW.d)-Date.UTC(y,m-1,day))/864e5);
  if(x<=0) return "היום";
  if(x===1) return "אתמול";
  if(x<7) return "לפני "+x+" ימים";
  if(x<14) return "לפני שבוע";
  if(x<60) return "לפני "+Math.round(x/7)+" שבועות";
  return "לפני "+Math.round(x/30)+" חודשים";
}
function fmtD(d){if(!d) return "";const p=String(d).split("-");return Number(p[2])+"."+Number(p[1]);}
function nextDelivery(s){
  const dd=s.dd||[];
  for(let i=1;i<=7;i++){const k=DOW[(NOW.wd+i)%7];if(dd.includes(k)) return i===1?"מחר":"יום "+DFULL[k];}
  return null;
}
function cutM(s){
  if(!s.cut) return 2000;
  const [h,m]=s.cut.split(":").map(Number), v=h*60+m, now=NOW.hh*60+NOW.mm;
  return v<=now?3000+v:v;
}
function cutChip(s){
  if(!s.cut) return `<span class="chip">${I.clock}בלי שעת סגירה</span>`;
  const [h,m]=s.cut.split(":").map(Number);
  const mins=h*60+m-(NOW.hh*60+NOW.mm);
  if(mins<=0) return `<span class="chip">${I.clock}נסגר ב-${esc(s.cut)}</span>`;
  if(mins>=180) return `<span class="chip">${I.clock}נסגר ב-${esc(s.cut)}</span>`;
  const t=mins<60?mins+" דק׳":Math.floor(mins/60)+":"+String(mins%60).padStart(2,"0")+" שע׳";
  return `<span class="chip ${mins<=90?"hot":"warm"}">${I.clock}נסגר בעוד ${t}</span>`;
}
function odLabel(s){return s.od&&s.od.length?s.od.map(d=>DH[d]||d).join(" "):"לפי צורך";}
function kind(s){return CAT[s.cat]||"אוכל";}
function priceOK(pr){return !!(pr&&pr.prev!=null&&!pr.seasonal&&Math.abs(pr.ch)>=3&&Math.abs(pr.ch)<=100);}
function isStale(pr){
  if(!pr||!pr.d) return false;
  const cut=new Date(Date.UTC(NOW.y,NOW.m-1,NOW.d)-90*864e5).toISOString().slice(0,10);
  return pr.d<cut;
}
function ring(done,total){
  const r=28,c=2*Math.PI*r,p=total?done/total:0;
  return `<div class="ring"><svg viewBox="0 0 66 66"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFC65C"/></linearGradient></defs><circle cx="33" cy="33" r="${r}" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="33" cy="33" r="${r}" stroke="url(#rg)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}"/></svg><div class="t"><div style="text-align:center;line-height:1">${done}<small>/${total}</small></div></div></div>`;
}
function spark(a){
  const m=Math.max(1,...a);
  return `<div class="spark" title="הזמנות ב-12 השבועות האחרונים">${a.map(v=>`<i class="${v?"":"z"}" style="height:${v?Math.max(18,Math.round(v/m*100)):8}%"></i>`).join("")}</div>`;
}
function delta(pr){
  if(!priceOK(pr)) return "";
  const up=pr.ch>0;
  return `<span class="delta ${up?"up":"down"}">${up?I.up:I.down}${Math.abs(Math.round(pr.ch))}%</span>`;
}
function supMeta(s){
  return [s.orders?s.orders+" הזמנות מאז מאי":"עוד לא הוזמן באפליקציה",s.last?"אחרונה "+daysAgo(s.last):null,s.products.length+" מוצרים"].filter(Boolean).join(" · ");
}
function supCard(s){
  return `<button type="button" class="card" data-open="${esc(s.id)}">${av(s)}<div class="mid"><div class="nm">${esc(s.n)}</div><div class="meta">${esc(supMeta(s))}</div></div>${spark(s.spark)}${I.chev}</button>`;
}

const state={view:"home",sid:null,filter:"הכל",showHidden:false,qty:{},unitSel:{},q:"",returnTo:"home",sent:new Set(),session:[],insights:{},insightTried:{},insOpen:{},ready:false};
const model={visible:[],hidden:[],tala:[],byId:{},orders:[],rises:[],drops:[],pricesOn:false};

function dueList(){
  const key=DOW[NOW.wd];
  return model.visible.filter(s=>(s.od||[]).includes(key)).sort((a,b)=>cutM(a)-cutM(b));
}
function syncSent(){
  const t=iso(NOW);
  state.sent=new Set(model.orders.filter(o=>o.order_date===t).map(o=>o.supplier_id));
  state.session.forEach(x=>{if(x.day===t) state.sent.add(x.id);});
}
function markSent(id){state.session.push({id,day:iso(ilNow())});state.sent.add(id);}
function cur(){return model.byId[state.sid]||null;}
function listFor(filter){
  if(filter==="טאלה") return model.tala;
  return model.visible.filter(s=>filter==="הכל"||kind(s)===filter);
}
function home(){
  const due=dueList();
  const done=due.filter(s=>state.sent.has(s.id)).length;
  const first=due.find(s=>s.cut&&cutM(s)<2000);
  const greet=NOW.hh<12?"בוקר טוב":NOW.hh<17?"צהריים טובים":"ערב טוב";
  const tabs=["הכל","אוכל","בר","חד פעמי"].concat(model.tala.length?["טאלה"]:[]);
  const list=listFor(state.filter);
  const rises=model.rises;
  return `<section class="hello stagger"><div class="date">יום ${DFULL[DOW[NOW.wd]]} · ${NOW.d} ב${MONTHS[NOW.m-1]}</div><h1>${greet}, <span>ירין</span></h1></section>
  <section class="hero stagger"><div class="hero-head">${ring(done,due.length)}<div><h2>להזמין היום</h2><p><b>${due.length} ספקים</b> שהיום הוא יום הזמנה אצלם${first?`<br>הקרוב נסגר ב-<b class="num">${esc(first.cut)}</b>`:""}</p></div></div>
  ${due.length?due.map(s=>{const sent=state.sent.has(s.id),nd=nextDelivery(s);return `<div class="due">${av(s)}<div class="mid"><div class="nm">${esc(s.n)}</div><div class="chips">${cutChip(s)}${nd?`<span class="chip">${I.truck}אספקה ${nd}</span>`:""}</div></div><button type="button" class="go ${sent?"done":""}" data-open="${esc(s.id)}">${sent?I.check+"נשלח":"הזמן"}</button></div>`;}).join(""):'<div class="due empty">אין ספקים שצריך להזמין מהם היום</div>'}
  </section>
  ${rises.length?`<div class="sec"><h3>עליות מחיר</h3><span>מחשבוניות מאושרות</span></div><div class="rail">${rises.slice(0,8).map(({s,p})=>`<button type="button" class="alert" data-open="${esc(s.id)}"><div class="sup">${esc(s.n)}</div><div class="pn">${esc(p.n)}</div><div class="row"><div class="px"><s>${money(p.pr.prev)}</s> ← <b>${money(p.pr.p)}</b></div>${delta(p.pr)}</div></button>`).join("")}</div>`:""}
  <div class="sec"><h3>כל הספקים</h3><span>${state.filter==="טאלה"?"מסעדת טאלה":"לפי כמות הזמנות"}</span></div>
  <div class="seg">${tabs.map(t=>`<button type="button" data-filter="${t}" class="${state.filter===t?"on":""}">${t}<span class="num" style="opacity:.6">${listFor(t).length}</span></button>`).join("")}</div>
  <div class="list stagger">${list.map(supCard).join("")||'<div class="empty">אין ספקים בקבוצה הזו</div>'}</div>
  ${state.filter==="טאלה"?"":`<button type="button" class="fold" id="fold">${I.eye}${state.showHidden?"הסתרת":"הצגת"} ${model.hidden.length} ספקים שלא בשימוש</button>${state.showHidden?`<div class="list" style="opacity:.72">${model.hidden.map(supCard).join("")}</div>`:""}`}`;
}
function allView(){

async function apiAll(table,query){
  const page=1000; let from=0, all=[];
  for(let n=0;n<20;n++){
    const res=await fetch(SB+"/rest/v1/"+table+"?"+query,{headers:Object.assign(headers(),{Range:from+"-"+(from+page-1)})});
    if(!res.ok) throw new Error(table);
    const rows=await res.json();
    if(!Array.isArray(rows)) throw new Error(table);
    all=all.concat(rows);
    if(rows.length<page) break;

function priceInfo(rows,sid){

  for(let i=rows.length-2;i>=0;i--){if(Math.abs(rows[i].v-last.v)>1e-9){prev=rows[i];break;}}
  const ch=prev&&prev.v?Math.round((last.v-prev.v)/prev.v*1000)/10:0;
  return {p:last.v,d:last.d,prev:prev?prev.v:null,pd:prev?prev.d:null,ch,seasonal:SEASONAL.has(sid)};
}
function buildModel(suppliers,products,orders,priceRows){
  const today=ilNow();
  const since=(today.m>=5?today.y:today.y-1)+"-05-01";
  const todayUTC=Date.UTC(today.y,today.m-1,today.d);
  const ph={};
  priceRows.forEach(r=>{
    if(!r.product_id||r.unit_price==null||r.unit_price==="") return;
    const v=Number(r.unit_price); if(!Number.isFinite(v)) return;
    (ph[r.product_id]||(ph[r.product_id]=[])).push({d:r.invoice_date,v});
  });
  Object.keys(ph).forEach(k=>ph[k].sort((a,b)=>String(a.d).localeCompare(String(b.d))));
  const prodCnt={}, lastQty={}, bySid={};
  const spark={}, supOrders={}, supLast={};
  const sorted=orders.slice().sort((a,b)=>String(a.order_date).localeCompare(String(b.order_date)));
  sorted.forEach(o=>{
    const sid=o.supplier_id; if(!sid) return;
    supLast[sid]=o.order_date;
    if(o.order_date>=since) supOrders[sid]=(supOrders[sid]||0)+1;
    if(o.order_date){
      const p=String(o.order_date).split("-").map(Number);
      const w=Math.floor((todayUTC-Date.UTC(p[0],p[1]-1,p[2]))/864e5/7);
      if(w>=0&&w<12){spark[sid]=spark[sid]||Array(12).fill(0); spark[sid][11-w]++;}
    }
    const seen=new Set(); const map={};
    (o.items||[]).forEach(it=>{
      const nm=norm(it&&it.name);
      const keys=[];
      if(it&&it.id) keys.push("id:"+it.id);
      if(nm) keys.push("n:"+nm);
      keys.forEach(k=>{
        const ck=sid+"|"+(o.id||o.order_date)+"|"+k;
        if(seen.has(ck)) return; seen.add(ck);
        if(o.order_date>=since){const kk=sid+"|"+k; prodCnt[kk]=(prodCnt[kk]||0)+1;}
        lastQty[sid+"|"+k]=it.qty;
      });
      if(it&&it.id) map["id:"+it.id]=it;
      if(nm) map["n:"+nm]=it;
    });
    bySid[sid]=map;
  });
  const prodsBy={};
  products.forEach(p=>{
    if(p.discontinued===true) return;
    (prodsBy[p.supplier_id]||(prodsBy[p.supplier_id]=[])).push(p);
  });
  model.visible=[]; model.hidden=[]; model.tala=[]; model.byId={};
  model.orders=orders.slice();
  model.pricesOn=priceRows.length>0;
  suppliers.forEach(s=>{
    if(NON.has(s.category)) return;
    const tala=s.location==="טאלה"||s.category==="tala";
    const raw=prodsBy[s.id]||[];
    const last=bySid[s.id]||{};
    const prods=raw.map(p=>{
      const nk="n:"+norm(p.name), ik="id:"+p.id;
      const cnt=Math.max(prodCnt[s.id+"|"+ik]||0, prodCnt[s.id+"|"+nk]||0);
      const hit=last[ik]||last[nk]||null;
      return {id:p.id,n:p.name,u:p.order_unit||p.unit||"יח'",unit:p.unit,order_unit:p.order_unit,order_units:p.order_units,c:p.category||"",cnt,lo:hit?hit.qty:null,loUnit:hit?hit.unit:null,pr:priceInfo(ph[p.id],s.id)};
    }).sort((a,b)=>b.cnt-a.cnt||String(a.n).localeCompare(String(b.n),"he"));
    const rec={
      id:s.id,n:s.name,cat:s.category,ph:s.phone,ct:s.contact_name,
      od:asArr(s.order_days),cut:s.order_cutoff?String(s.order_cutoff).slice(0,5):null,
      dd:asArr(s.delivery_days),orders:supOrders[s.id]||0,last:supLast[s.id]||null,
      spark:spark[s.id]||Array(12).fill(0),location:s.location,products:prods
    };
    model.byId[s.id]=rec;
    if(tala){if(prods.length) model.tala.push(rec);return;}
    rec.hide=QUIET.has(s.id)||prods.length===0;
    (rec.hide?model.hidden:model.visible).push(rec);
  });
  const byUse=(a,b)=>b.orders-a.orders||String(a.n).localeCompare(String(b.n),"he");
  model.visible.sort(byUse);
  model.hidden.sort((a,b)=>String(a.n).localeCompare(String(b.n),"he"));
  model.tala.sort((a,b)=>(TALA_ORDER.indexOf(a.id)<0?99:TALA_ORDER.indexOf(a.id))-(TALA_ORDER.indexOf(b.id)<0?99:TALA_ORDER.indexOf(b.id)));
  model.rises=[]; model.drops=[];
  model.visible.forEach(s=>s.products.forEach(p=>{
    if(!priceOK(p.pr)) return;
    if(p.pr.ch>0) model.rises.push({s,p});
    else if(p.pr.ch<0) model.drops.push({s,p});
  }));
  model.rises.sort((a,b)=>b.p.pr.ch-a.p.pr.ch);
  model.drops.sort((a,b)=>a.p.pr.ch-b.p.pr.ch);
}
function bootError(msg){
  $("#boot").classList.remove("hidden");
  $("#boot").innerHTML='<p style="color:#FF5D6C">'+esc(msg)+'</p><button type="button" class="boot-btn" id="retry">נסו שוב</button>';
}
async function boot(){
  $("#boot").classList.remove("hidden");
  $("#boot").innerHTML='<div class="spinner"></div><p>טוען את פסאו…</p>';
  try{
    const suppliers=await apiAll("suppliers","select=id,name,category,phone,contact_name,order_days,order_cutoff,delivery_days,location&active=eq.true");
    const products=await apiAll("products","select=id,name,supplier_id,unit,category,order_unit,order_units,discontinued&active=eq.true");
    const orders=await apiAll("orders_log","select=id,supplier_id,order_date,items,total_items,status&order=order_date.desc");
    let prices=[];
    try{prices=await apiAll("product_price_history","select=product_id,supplier_id,unit_price,invoice_date&order=invoice_date.asc");}
    catch(e){prices=[];}
    buildModel(suppliers,products,orders,prices);
    state.ready=true;
    const U=new URLSearchParams(location.search);
    const V=U.get("view")||"home", SID=U.get("sid");
    if(SID&&model.byId[SID]&&(V==="supplier"||V==="summary")){state.view="supplier";state.sid=SID;state.returnTo="home";}
    else state.view=["home","all","prices","history"].includes(V)?V:"home";
    $("#boot").classList.add("hidden");
    $("#app").classList.remove("hidden");
    setTheme(document.documentElement.dataset.theme||"dark");
    render({top:0});
    if(state.view==="supplier") loadInsights(state.sid);
    if(V==="summary"&&cartItems().length) openSheet();
  }catch(e){
    bootError("שגיאה בטעינה. בדקו חיבור.");
  }
}
boot();
</script>
